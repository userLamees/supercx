<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SuperCX | الأسئلة الشائعة</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/tokens.css?v=12">
  <link rel="stylesheet" href="/static/styles.css?v=12">
</head>
<body class="page-tint">
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/" data-brand-logo aria-label="SuperCX"></a>
      <nav class="nav-links" data-i18n-aria="nav.main">
        <a href="/" data-i18n="nav.chat">المحادثة</a>
        <a href="/faq" aria-current="page" data-i18n="nav.faq">الأسئلة الشائعة</a>
        <a href="/#requests" data-i18n="faq.myRequests">طلباتي</a>
      </nav>
      <div class="nav-end">
        <a class="new-chat-btn" href="/" data-i18n-aria="faq.newChat"><i data-lucide="square-pen" class="icon icon-sm"></i><span data-i18n="faq.newChat">محادثة جديدة</span></a>
        <a class="icon-btn has-badge" href="/#requests" data-i18n-aria="faq.myRequests"><i data-lucide="inbox" class="icon"></i></a>
        <button class="lang-btn" type="button" data-lang-toggle data-i18n="lang.toggle" data-i18n-aria="lang.toggleAria">EN</button>
      </div>
    </div>
  </header>

  <main class="container page">
    <a class="back-btn" href="/"><i data-lucide="arrow-left" class="icon flip"></i><span data-i18n="nav.back">العودة للمحادثة</span></a>
    <div class="page-head">
      <h1 data-i18n="faq.title">الأسئلة الشائعة</h1>
      <p data-i18n="faq.sub">إجابات موثوقة في مكان واحد · محتوى تجريبي</p>
    </div>
    <form class="search" role="search" onsubmit="return false">
      <i data-lucide="search" class="icon"></i>
      <label class="sr-only" for="q" data-i18n="faq.searchLabel">البحث في الأسئلة</label>
      <input id="q" type="search" autocomplete="off" dir="auto" data-i18n-ph="faq.searchPh">
    </form>
    <p class="faq-empty" id="faq-state" role="status" hidden></p>
    <div class="faq-sections" id="sections"></div>
    <a class="ask-cta" href="/"><span data-i18n="faq.ask">ما وجدت إجابتك؟ اسأل المساعد</span><i data-lucide="arrow-left" class="icon flip-rev"></i></a>
    <a class="ask-cta ask-cta-quiet" href="/#contact"><span data-i18n="faq.contact">تفضّل التواصل مع الفريق مباشرة؟</span><i data-lucide="message-square" class="icon"></i></a>
  </main>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="/static/brand.js?v=12"></script>
  <script src="/static/i18n.js?v=12"></script>
  <script src="/static/faq.js?v=12"></script>
</body>
</html>
