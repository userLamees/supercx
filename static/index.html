<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SuperCX | مساعد جمعية تجربة العميل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">SuperCX<small>مساعد العضويات · اسأل بالعربي أو English</small></div>
    </header>

    <main class="log" id="log" aria-live="polite">
      <div class="msg bot" dir="auto">أهلًا! أساعدك تختار عضوية جمعية تجربة العميل المناسبة لك، وأحوّل سؤالك للدعم إذا ما لقيت جوابه في مصادر الجمعية.</div>
      <div class="starters" id="starters">
        <button type="button">أي عضوية تناسبني؟</button>
        <button type="button">Which membership lets me vote?</button>
        <button type="button">هل فيه خصم للطلاب؟</button>
      </div>
    </main>

    <form class="composer" id="composer">
      <input id="input" dir="auto" aria-label="رسالتك" autocomplete="off" placeholder="اكتب سؤالك…" required maxlength="2000">
      <button class="primary" id="send" type="submit">إرسال</button>
    </form>
  </div>
  <script src="/static/chat.js"></script>
</body>
</html>
